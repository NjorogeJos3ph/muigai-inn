<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muigai Inn — Dashboard</title>
<style>
:root{--bg:#1C1207;--surface:#2A1A0C;--surface-2:#362210;--amber:#D4A24C;--hot:#B8322A;--green:#2E8B57;--text:#F5E8CE;--muted:#B8A48C;--border:#3D2817;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;padding-bottom:40px;}
.header{padding:22px 20px;background:var(--surface);border-bottom:2px solid var(--amber);}
.header h1{font-size:1rem;color:var(--amber);text-transform:uppercase;font-weight:800;text-align:center;letter-spacing:.1em;}
.header .sub{text-align:center;font-size:.72rem;color:var(--muted);margin-top:4px;letter-spacing:.15em;text-transform:uppercase;}
.header .sync{text-align:center;font-size:.7rem;color:var(--green);margin-top:6px;}
.header .sync.error{color:var(--hot);}
.container{max-width:720px;margin:0 auto;padding:20px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:14px;}
.label{font-size:.65rem;letter-spacing:.22em;color:var(--amber);text-transform:uppercase;font-weight:800;margin-bottom:14px;}
.value{font-size:2.4rem;font-weight:900;color:var(--text);line-height:1;font-family:'Arial Black',sans-serif;}
.value.amber{color:var(--amber);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.list{list-style:none;}
.list li{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);font-size:.95rem;}
.list li:last-child{border-bottom:none;}
.list .num{font-weight:800;color:var(--amber);}
.alert{display:flex;align-items:center;gap:10px;padding:14px 16px;background:rgba(184,50,42,.1);border-left:3px solid var(--hot);border-radius:8px;margin-bottom:10px;font-size:.9rem;}
.alert .dot{width:8px;height:8px;border-radius:50%;background:var(--hot);flex-shrink:0;}
.alert.ok{background:rgba(46,139,87,.1);border-left-color:var(--green);}
.alert.ok .dot{background:var(--green);}
.loading{text-align:center;padding:60px 20px;color:var(--muted);}
.refresh-btn{width:100%;padding:16px;background:var(--amber);color:#1A0E05;border:none;border-radius:12px;font-weight:800;font-size:.9rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;margin-top:8px;min-height:54px;}
</style>
</head>
<body>

<div class="header">
  <h1>Muigai Inn — Dashboard</h1>
  <div class="sub" id="today">Leo</div>
  <div class="sync" id="syncStatus">Syncing…</div>
</div>

<div class="container" id="container">
  <div class="loading">Loading live data from Google Sheet…</div>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbxr2JeFzFS77BNE_2G-ErV-nw5iS-Xlk0S7GnT_pyvTToAJHmhOgFgaQsYFElDUJED2/exec';
const TOKEN = 'muigai-2026-secret';

async function apiCall(params) {
  const url = API + '?token=' + TOKEN + '&' + new URLSearchParams(params).toString();
  const r = await fetch(url);
  return await r.json();
}

function setSync(text, isErr) {
  const el = document.getElementById('syncStatus');
  el.textContent = text;
  el.classList.toggle('error', !!isErr);
}

async function loadDashboard() {
  try {
    setSync('Syncing…');
    const [items, dash] = await Promise.all([
      apiCall({ action: 'items' }),
      apiCall({ action: 'dashboard' })
    ]);
    setSync('✓ Live from Google Sheet');
    renderDashboard(items, dash);
  } catch (err) {
    setSync('Sync error', true);
    document.getElementById('container').innerHTML =
      '<div class="card"><div class="loading">Cannot reach server.<br>' + err.message + '</div></div>';
  }
}

function renderDashboard(items, d) {
  const c = document.getElementById('container');
  const today = new Date().toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'short' });
  document.getElementById('today').textContent = today;

  const alerts = (d.alerts || []).map(a => {
    if (a.level === 'out') return `<div class="alert"><span class="dot"></span>${a.name} — OUT of stock</div>`;
    return `<div class="alert"><span class="dot"></span>${a.name} — only ${a.left} left</div>`;
  }).join('') || '<div class="alert ok"><span class="dot"></span>All items in stock</div>';

  const byItem = (items || []).map(i => {
    const sold = (d.by_item && d.by_item[i.name]) || 0;
    const stock = Number(i.current_stock) || 0;
    if (sold === 0 && stock === Number(i.min_stock || 0) + 5) return '';
    return `<li><span>${i.name}</span><span class="num">${sold} sold · ${stock} left</span></li>`;
  }).filter(x => x).join('') || '<li>No sales yet today</li>';

  c.innerHTML = `
    <div class="card">
      <div class="label">Sales Leo · Today</div>
      <div class="value amber">KES ${(d.sales_total||0).toLocaleString()}</div>
    </div>
    <div class="grid2">
      <div class="card"><div class="label">Items Sold</div><div class="value">${d.items_sold||0}</div></div>
      <div class="card"><div class="label">Stock Added</div><div class="value">${d.stock_added||0}</div></div>
    </div>
    <div class="card">
      <div class="label">Top Seller</div>
      <div class="value">${d.top_seller ? d.top_seller.name + ' (' + d.top_seller.qty + ')' : '—'}</div>
    </div>
    <div class="card"><div class="label">Stock Alerts</div>${alerts}</div>
    <div class="card"><div class="label">By Item</div><ul class="list">${byItem}</ul></div>
    <button class="refresh-btn" onclick="loadDashboard()">↻ Refresh</button>
  `;
}

loadDashboard();
</script>
</body>
</html>
